# Base H2 de développement conservée sur le disque
spring.datasource.url=jdbc:h2:file:./data/personnesdevdb
spring.datasource.username=sa
spring.datasource.password=

# Gestion des tables par Hibernate
spring.jpa.hibernate.ddl-auto=update

# Affichage du SQL pendant le développement
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 disponible seulement en développement
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Afficher davantage d’informations dans les réponses d’erreur
server.error.include-message=always